[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"
[project]
name = "compu-j-layla-copilot"
version = "1.1.0"
authors = [

]
requires-python = ">=3.12"
readme = "README.md"
description = "Low-latency meeting copilot for smart glasses running MentraOS"
dependencies = ["faiss==1.5.3",
"fastapi==0.136.1",
"httpx==0.28.1",
"numpy==2.4.4",
"protobuf==7.34.1",
"pydantic==2.13.4",
"pypdf==6.11.0",
"sentence_transformers==5.3.0",
"uvicorn==0.46.0"
]


[project.urls]
Homepage = "https://github.com/compu-j-layla/layla-copilot/tree/feature/v1.1.0"
Issues = "https://github.com/compu-j-layla/layla-copilot/issues"